<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서진 수업 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker"><i></i>서울서진학교</p>
    <h1>수업 자료실</h1>
  </header>

  <div class="cards">
    <a class="card sky" href="digital/">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.7-2.3L4 15.6a1.6 1.6 0 0 1 2.4-2.1L9 16"/></svg></span>
      <b>서진학교 디지털 소양 교육</b>
      <p>터치스크린으로 누르고 고르고 끌기, 마우스로 포인터 옮기고 클릭하기, 키보드로 키 찾고 글자와 낱말 치기. 학생이 직접 해 보며 익힙니다.</p>
      <p class="meta">초 · 중 · 고 · 학교급마다 5단계씩 · 학생용</p>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="card clay" href="gear/">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2.2"/><path d="M8 20.5h8M12 16.5v4"/></svg></span>
      <b>기자재 · 교구 안내<span class="tag">준비 중</span></b>
      <p>전자칠판, 태블릿, 로봇 교구를 어떻게 꺼내 쓰고 다시 정리하는지 적어 둡니다.</p>
      <p class="meta">교사용</p>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>

  <footer>학생 이름이나 학습 기록은 저장하지 않습니다. 교사가 고른 설정만 그 컴퓨터의 브라우저에 남습니다.</footer>
</div>
</body>
</html>
