<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>손으로 내는 소리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=Nanum+Myeongjo:wght@700&display=swap">
<style>
  :root {
    --bg: #16150F;
    --panel: #221F17;
    --panel-2: #2E2A20;
    --ink: #F4F1E6;
    --ink-2: #BDB6A2;
    --muted: #8B8474;
    --line: #3A362A;
    --hot: #E8C25A;
    --hot-2: #C79A2E;
    --live: #7FD1A8;
  }
  :root[data-theme="light"] {
    --bg: #16150F;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Gothic A1", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }

  .wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* ── 시작 화면 ── */
  #start {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; padding: 24px; text-align: center; background: var(--bg);
  }
  #start h1 {
    font-family: "Nanum Myeongjo", serif; font-weight: 700;
    font-size: clamp(30px, 6vw, 52px); margin: 0; letter-spacing: -.01em;
  }
  #start p { margin: 0; color: var(--ink-2); max-width: 34ch; font-size: 16.5px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .big {
    background: var(--hot); color: #1A1710; border: 0; border-radius: 4px;
    font-size: 20px; font-weight: 700; padding: 20px 34px; min-width: 200px;
  }
  .big:hover { background: var(--hot-2); }
  .big.ghost { background: none; color: var(--ink); border: 2px solid var(--line); }
  .big.ghost:hover { border-color: var(--hot); color: var(--hot); }
  .note { font-size: 13.5px; color: var(--muted); max-width: 40ch; line-height: 1.7; }

  /* ── 연주 화면 ── */
  #stage { position: absolute; inset: 0; display: none; }
  #stage.on { display: block; }
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); filter: saturate(.55) brightness(.5);
  }
  #paint { position: absolute; inset: 0; width: 100%; height: 100%; }

  #note {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    font-family: "Nanum Myeongjo", serif; font-weight: 700;
    font-size: clamp(80px, 22vw, 220px); line-height: 1; color: var(--ink);
    text-shadow: 0 4px 40px rgba(0,0,0,.6); pointer-events: none; letter-spacing: -.02em;
  }
  #note.idle { color: var(--muted); opacity: .4; }
  #hint {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
    color: var(--ink-2); font-size: 16px; pointer-events: none; text-align: center;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }

  /* 음 높이 막대 */
  #ladder {
    position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column-reverse; gap: 5px; pointer-events: none;
  }
  #ladder i {
    display: block; width: 34px; height: 13px; border-radius: 2px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  #ladder i.on { background: var(--hot); border-color: var(--hot); }

  /* 아래 조작줄 */
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: linear-gradient(to top, rgba(22,21,15,.96), rgba(22,21,15,0));
  }
  .sound-btn {
    background: var(--panel); color: var(--ink-2); border: 2px solid var(--line);
    border-radius: 4px; font-size: 16px; font-weight: 700; padding: 12px 18px;
  }
  .sound-btn[aria-pressed="true"] { border-color: var(--hot); color: var(--hot); background: var(--panel-2); }
  .spacer { flex: 1; }
  .mini {
    background: var(--panel); color: var(--ink-2); border: 1px solid var(--line);
    border-radius: 4px; font-size: 14px; padding: 10px 14px;
  }
  .mini:hover { color: var(--hot); border-color: var(--hot); }

  /* 교사 설정 */
  #cfg {
    position: absolute; right: 14px; bottom: 72px; z-index: 12; width: 280px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 16px 18px; display: none;
  }
  #cfg.on { display: block; }
  #cfg h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; }
  #cfg label { display: block; font-size: 13.5px; color: var(--ink-2); margin: 12px 0 5px; }
  #cfg input[type=range] { width: 100%; accent-color: var(--hot); }
  #cfg .val { color: var(--hot); font-variant-numeric: tabular-nums; }
  #cfg p { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; line-height: 1.6; }

  #badge {
    position: absolute; left: 14px; top: 14px; z-index: 12;
    font-size: 12.5px; color: var(--ink-2); background: rgba(34,31,23,.85);
    border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px;
  }
  #badge b { color: var(--live); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="start">
    <h1>손으로 내는 소리</h1>
    <p>손을 위로 올리면 높은 소리, 아래로 내리면 낮은 소리가 납니다. 손을 펴면 소리가 밝아지고, 주먹을 쥐면 어두워집니다.</p>
    <div class="btn-row">
      <button class="big" id="go-cam" type="button">카메라로 시작</button>
      <button class="big ghost" id="go-mouse" type="button">화면 만지기</button>
    </div>
    <p class="note">카메라가 열리지 않으면 화면 만지기로도 같은 소리가 납니다. 태블릿에서는 손가락으로 됩니다.</p>
    <p class="note">카메라 화면은 이 기기 안에서만 처리합니다. 저장하지 않고 어디로도 보내지 않습니다. 밝은 곳에서 손이 화면에 크게 들어오도록 서면 잘 잡힙니다.</p>
    <p class="note" id="err" style="color:var(--hot)"></p>
  </div>

  <div id="stage">
    <video id="view" playsinline muted></video>
    <canvas id="paint"></canvas>
    <div id="badge">준비</div>
    <div id="note" class="idle">···</div>
    <div id="hint">손을 들어 보세요</div>
    <div id="ladder"></div>

    <div id="cfg">
      <h2>교사 설정</h2>
      <label>음량 <span class="val" id="v-vol">40</span></label>
      <input type="range" id="s-vol" min="0" max="100" value="40">
      <label>손 인식 민감도 <span class="val" id="v-sens">50</span></label>
      <input type="range" id="s-sens" min="10" max="90" value="50">
      <label>음 개수 <span class="val" id="v-steps">5</span></label>
      <input type="range" id="s-steps" min="3" max="10" value="5">
      <p>소리가 계속 나면 민감도를 낮추세요. 손을 들어도 반응이 없으면 민감도를 올리고 조명을 밝게 하세요.</p>
    </div>

    <div id="bar">
      <button class="sound-btn" data-tone="0" aria-pressed="true" type="button">맑은 소리</button>
      <button class="sound-btn" data-tone="1" aria-pressed="false" type="button">부드러운 소리</button>
      <button class="sound-btn" data-tone="2" aria-pressed="false" type="button">방울 소리</button>
      <span class="spacer"></span>
      <button class="mini" id="toggle-cfg" type="button">설정</button>
      <button class="mini" id="stop" type="button">멈추기</button>
    </div>
  </div>
</div>

<script>
(function () {
  var startEl = document.getElementById('start');
  var stage = document.getElementById('stage');
  var video = document.getElementById('view');
  var paint = document.getElementById('paint');
  var noteEl = document.getElementById('note');
  var hintEl = document.getElementById('hint');
  var ladder = document.getElementById('ladder');
  var badge = document.getElementById('badge');
  var errEl = document.getElementById('err');
  var cfg = document.getElementById('cfg');

  var NAMES = ['도', '레', '미', '솔', '라', '높은 도', '높은 레', '높은 미', '높은 솔', '높은 라'];
  var FREQS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

  var steps = 5, volume = 0.40, sens = 50, tone = 0;
  var mode = null;              // 'cam' | 'mouse'
  var stream = null, raf = 0;
  var ctx = null, osc = null, osc2 = null, filt = null, gain = null, panner = null;
  var cur = -1, held = 0, smoothX = 0.5, smoothY = 0.5, smoothSize = 0;

  var work = document.createElement('canvas');
  work.width = 160; work.height = 120;
  var wctx = work.getContext('2d', { willReadFrequently: true });
  var pctx = paint.getContext('2d');

  function buildLadder() {
    ladder.innerHTML = '';
    for (var i = 0; i < steps; i++) ladder.appendChild(document.createElement('i'));
  }

  function audio() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { build(AC); } catch (e) { ctx = null; }
  }

  function build(AC) {
    ctx = new AC();
    gain = ctx.createGain();
    gain.gain.value = 0;
    filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 1200;
    filt.Q.value = 0.7;
    panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    osc = ctx.createOscillator();
    osc2 = ctx.createOscillator();
    osc.type = 'sine';
    osc2.type = 'triangle';
    osc.frequency.value = 261.63;
    osc2.frequency.value = 261.63;
    var mix = ctx.createGain();
    mix.gain.value = 0.35;
    osc.connect(filt);
    osc2.connect(mix);
    mix.connect(filt);
    if (panner) { filt.connect(panner); panner.connect(gain); }
    else { filt.connect(gain); }
    gain.connect(ctx.destination);
    osc.start(); osc2.start();
  }

  function setTone(t) {
    tone = t;
    var b = document.querySelectorAll('.sound-btn');
    for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', String(i === t));
    if (!ctx) return;
    if (t === 0) { osc.type = 'sine'; osc2.type = 'triangle'; filt.Q.value = 0.7; }
    if (t === 1) { osc.type = 'triangle'; osc2.type = 'sine'; filt.Q.value = 0.5; }
    if (t === 2) { osc.type = 'square'; osc2.type = 'sine'; filt.Q.value = 3.0; }
  }

  function play(idx, openness, x) {
    if (!ctx) return;
    var now = ctx.currentTime;
    var f = FREQS[Math.max(0, Math.min(FREQS.length - 1, idx))];
    osc.frequency.setTargetAtTime(f, now, 0.03);
    osc2.frequency.setTargetAtTime(f * 2, now, 0.03);
    filt.frequency.setTargetAtTime(500 + openness * 3200, now, 0.05);
    if (panner) panner.pan.setTargetAtTime((x - 0.5) * 1.2, now, 0.08);
    var target = volume * (tone === 2 ? 0.5 : 1);
    gain.gain.setTargetAtTime(target, now, 0.04);
  }

  function silence() {
    if (!ctx) return;
    gain.gain.setTargetAtTime(0, ctx.currentTime, 0.12);
  }

  function show(idx, found) {
    var lit = ladder.children;
    for (var i = 0; i < lit.length; i++) lit[i].className = (found && i === idx) ? 'on' : '';
    if (!found) {
      if (!noteEl.classList.contains('idle')) { noteEl.className = 'idle'; noteEl.textContent = '···'; }
      hintEl.textContent = '손을 들어 보세요';
      return;
    }
    var nm = NAMES[Math.min(idx, NAMES.length - 1)];
    if (noteEl.textContent !== nm) noteEl.textContent = nm;
    noteEl.className = '';
    hintEl.textContent = '위로 올리면 높은 소리';
  }

  // 살빛 픽셀을 세어 손의 위치와 크기를 구한다
  function scan() {
    var w = work.width, h = work.height;
    wctx.drawImage(video, 0, 0, w, h);
    var d;
    try { d = wctx.getImageData(0, 0, w, h).data; } catch (e) { return null; }
    var thr = 10 + (100 - sens) * 0.22;
    var sx = 0, sy = 0, n = 0;
    for (var y = 0; y < h; y += 2) {
      for (var x = 0; x < w; x += 2) {
        var i = (y * w + x) * 4;
        var r = d[i], g = d[i + 1], b = d[i + 2];
        var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        if (r > 80 && g > 30 && b > 20 && mx - mn > thr && r - g > thr * 0.7 && r > b) {
          sx += x; sy += y; n++;
        }
      }
    }
    var total = (w / 2) * (h / 2);
    if (n < total * 0.012) return null;
    return { x: 1 - (sx / n) / w, y: (sy / n) / h, size: n / total };
  }

  function drawMark(x, y, size) {
    var W = paint.width, H = paint.height;
    pctx.clearRect(0, 0, W, H);
    if (x == null) return;
    var r = 26 + size * 260;
    var g = pctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r);
    g.addColorStop(0, 'rgba(232,194,90,.55)');
    g.addColorStop(1, 'rgba(232,194,90,0)');
    pctx.fillStyle = g;
    pctx.beginPath(); pctx.arc(x * W, y * H, r, 0, 6.284); pctx.fill();
  }

  function resize() {
    paint.width = paint.clientWidth; paint.height = paint.clientHeight;
  }

  function frame() {
    raf = requestAnimationFrame(frame);
    if (mode !== 'cam') return;
    var hit = scan();
    if (!hit) {
      held = Math.max(0, held - 1);
      if (held === 0) { silence(); show(0, false); drawMark(null); }
      return;
    }
    held = 6;
    smoothX += (hit.x - smoothX) * 0.35;
    smoothY += (hit.y - smoothY) * 0.35;
    smoothSize += (hit.size - smoothSize) * 0.25;
    var idx = Math.min(steps - 1, Math.floor((1 - smoothY) * steps));
    var open = Math.max(0, Math.min(1, (smoothSize - 0.02) / 0.16));
    play(idx, open, smoothX);
    show(idx, true);
    drawMark(smoothX, smoothY, smoothSize);
  }

  function pointer(ev) {
    if (mode !== 'mouse') return;
    var rect = paint.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    var x = (t.clientX - rect.left) / rect.width;
    var y = (t.clientY - rect.top) / rect.height;
    x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y));
    var idx = Math.min(steps - 1, Math.floor((1 - y) * steps));
    var open = 1 - Math.abs(x - 0.5) * 1.4;
    play(idx, Math.max(0, open), x);
    show(idx, true);
    drawMark(x, y, 0.08);
  }

  function enter(kind) {
    mode = kind;
    startEl.style.display = 'none';
    stage.classList.add('on');
    resize();
    buildLadder();
    audio();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    setTone(tone);
    if (kind === 'mouse') {
      badge.innerHTML = '<b>마우스</b> 화면 위에서 움직여 보세요';
      hintEl.textContent = '화면 위에서 움직여 보세요';
      paint.addEventListener('mousemove', pointer);
      paint.addEventListener('touchmove', pointer, { passive: true });
      paint.addEventListener('mouseleave', function () { silence(); show(0, false); drawMark(null); });
    } else {
      badge.innerHTML = '<b>카메라</b> 저장하지 않습니다';
      cancelAnimationFrame(raf); frame();
    }
  }

  document.getElementById('go-mouse').addEventListener('click', function () { enter('mouse'); });

  function why(e) {
    var n = (e && e.name) || '알 수 없음';
    if (n === 'NotAllowedError') {
      var framed = false;
      try { framed = window.top !== window.self; } catch (x) { framed = true; }
      if (framed) return '이 페이지가 틀 안에서 열려 있어 카메라를 쓸 수 없습니다. 화면 만지기로 진행하세요. (' + n + ')';
      return '카메라 권한이 거부됐습니다. 주소창 왼쪽 자물쇠에서 카메라를 허용으로 바꾼 뒤 다시 눌러 주세요. (' + n + ')';
    }
    if (n === 'NotFoundError' || n === 'OverconstrainedError') return '쓸 수 있는 카메라를 찾지 못했습니다. (' + n + ')';
    if (n === 'NotReadableError') return '다른 프로그램이 카메라를 쓰고 있습니다. 화상회의 창을 닫고 다시 눌러 주세요. (' + n + ')';
    if (n === 'SecurityError') return '보안 설정 때문에 카메라를 열 수 없습니다. (' + n + ')';
    return '카메라를 열지 못했습니다. (' + n + ')';
  }

  document.getElementById('go-cam').addEventListener('click', function () {
    errEl.textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errEl.textContent = '이 브라우저에서는 카메라를 쓸 수 없습니다. 화면 만지기를 눌러 주세요.';
      return;
    }
    var blocked = false;
    try {
      if (document.featurePolicy && document.featurePolicy.allowsFeature &&
          !document.featurePolicy.allowsFeature('camera')) blocked = true;
    } catch (x) {}
    if (blocked) {
      errEl.textContent = '이 페이지에는 카메라 사용이 허용돼 있지 않습니다. 화면 만지기로 진행하세요.';
      return;
    }
    errEl.textContent = '카메라를 여는 중';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function (s) {
        stream = s; video.srcObject = s;
        errEl.textContent = '';
        enter('cam');
        var p = video.play();
        if (p && p.catch) p.catch(function () {
          badge.innerHTML = '<b>카메라</b> 화면을 눌러 시작하세요';
          document.addEventListener('click', function once() {
            video.play(); document.removeEventListener('click', once);
          });
        });
      })
      .catch(function (e) { errEl.textContent = why(e); });
  });

  document.getElementById('stop').addEventListener('click', function () {
    silence(); cancelAnimationFrame(raf); raf = 0; mode = null;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    stage.classList.remove('on'); cfg.classList.remove('on');
    startEl.style.display = 'flex';
  });

  document.getElementById('toggle-cfg').addEventListener('click', function () { cfg.classList.toggle('on'); });

  var b = document.querySelectorAll('.sound-btn');
  for (var i = 0; i < b.length; i++) {
    (function (n) { b[n].addEventListener('click', function () { setTone(n); }); })(i);
  }

  function bind(id, val, fn) {
    var el = document.getElementById(id), out = document.getElementById(val);
    el.addEventListener('input', function () { out.textContent = el.value; fn(Number(el.value)); });
  }
  bind('s-vol', 'v-vol', function (v) { volume = v / 250; });
  bind('s-sens', 'v-sens', function (v) { sens = v; });
  bind('s-steps', 'v-steps', function (v) { steps = v; buildLadder(); });

  window.addEventListener('resize', resize);
  buildLadder();
})();
</script>
</body>
</html>
